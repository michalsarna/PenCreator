[package]
name = "pencreator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PenCreator: open-source pen plotter software: devices, pens as layers, fill lines, plot preview and G-code"

[dependencies]
base-core = { git = "https://github.com/michalsarna/baseCreator", tag = "v1.34.0" }
base-ui = { git = "https://github.com/michalsarna/baseCreator", tag = "v1.34.0" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence", "links"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "0.37"

[features]
# Live camera capture, passed on to base-ui: cargo run --features camera
camera = ["base-ui/camera"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "PenCreator"
identifier = "io.github.michalsarna.pencreator"
icon = ["../../assets/icons/icon-256.png", "../../assets/icons/icon-512.png"]
short_description = "Open-source pen plotter software"

[package.metadata.bundle.osx]
minimum_system_version = "11.0"

[package.metadata.deb]
name = "pencreator"
maintainer = "PenCreator contributors <noreply@github.com>"
section = "graphics"
priority = "optional"
# The GUI loads libxkbcommon-x11 and libGL at run time, so list them explicitly.
depends = "$auto, libxkbcommon-x11-0, libgl1"
extended-description = "Design shapes or import SVG and PDF, set pens as layers, see the plot and write G-code for pen plotters."
assets = [
  ["target/release/pencreator", "usr/bin/", "755"],
  ["../../assets/pencreator.desktop", "usr/share/applications/", "644"],
  ["../../assets/icons/icon-48.png", "usr/share/icons/hicolor/48x48/apps/pencreator.png", "644"],
  ["../../assets/icons/icon-128.png", "usr/share/icons/hicolor/128x128/apps/pencreator.png", "644"],
  ["../../assets/icons/icon-256.png", "usr/share/icons/hicolor/256x256/apps/pencreator.png", "644"],
  ["../../assets/icons/icon-512.png", "usr/share/icons/hicolor/512x512/apps/pencreator.png", "644"],
  ["../../README.md", "usr/share/doc/pencreator/README.md", "644"],
  ["../../LICENSE", "usr/share/doc/pencreator/LICENSE", "644"],
  ["../../LICENSE-APACHE", "usr/share/doc/pencreator/LICENSE-APACHE", "644"],
]

[dev-dependencies]
# Renders the UI headlessly to PNG for the README screenshots (see src/screenshots.rs).
egui_kittest = { version = "0.37", features = ["wgpu"] }
# The harness of the tests against the GRBL simulator (src/grbl_sim_tests.rs).
base-ui = { git = "https://github.com/michalsarna/baseCreator", tag = "v1.34.0", features = ["sim-tests"] }
